# Builds the dashboard (see Dockerfile) and serves it with nginx on port 80.
# Update on the server with:  git pull && docker compose up -d --build
# Joins the backend's "catering" network so /backend/* can reach the API container.
# Start the backend first: it creates that network.
services:
  dashboard:
    build: .
    image: catering-dashboard
    ports:
      - "80:80"
    networks:
      - catering
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  catering:
    external: true
