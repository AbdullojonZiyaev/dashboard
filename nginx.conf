# nginx for the built dashboard (dist/) on the server. Mounted by compose.yaml as
# /etc/nginx/conf.d/default.conf.
#
#   /            the dashboard (static files from dist/)
#   /backend/*   forwarded to the backend API container "api" on port 8000, read-only.
#                The Sensor readings page uses it. Same address as `npm run dev`, so the
#                same build works locally and here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's internal DNS. Looking "api" up per request means nginx still starts
    # (and serves the dashboard) when the backend is down; /backend then answers 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /backend/ {
        # The dashboard only reads. Sensor units do not post through here.
        limit_except GET {
            deny all;
        }
        set $api http://api:8000;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # The chatbot endpoint only exists in `npm run dev` / `npm run preview`.
    # A clean 404 makes the assistant switch to its offline answers.
    location /api/ {
        return 404;
    }

    # Built files have a content hash in their name, so they can be cached for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must not be cached, so a new build shows up straight away
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
